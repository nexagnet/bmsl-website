# LOCAL, DISPOSABLE stack for proving the ContactLead e-mail path (Issue #82). Synthetic data only.
#   docker compose -f scripts/lead-email/compose.yml -p bmsl-lead-mail up -d
#   docker compose -f scripts/lead-email/compose.yml -p bmsl-lead-mail down -v      # removes the data too
# Bound to 127.0.0.1 only. The credentials below are throwaway values that exist only inside this stack; they are not
# BMSL secrets and must never be reused anywhere else. Mailpit accepts every message and delivers nothing to the internet.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bmsl
      POSTGRES_PASSWORD: local-throwaway-not-a-secret
      POSTGRES_DB: postgres
    ports: ['127.0.0.1:15432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bmsl']
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '127.0.0.1:18025:1025' # SMTP
      - '127.0.0.1:18026:8025' # web UI + REST API
