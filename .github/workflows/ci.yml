name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Control-plane contract tests
        run: node --test tools/autopilot/control-plane.test.mjs
      - name: Syntax-check autopilot scripts
        run: |
          set -euo pipefail
          for f in tools/autopilot/*.mjs; do node --check "$f"; done
      - uses: pnpm/action-setup@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          version: 10.34.4
      - name: Install application dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile
      - name: Application verify scripts
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); for (const s of ['lint','typecheck','test','build']) { if (!p.scripts?.[s]) process.exit(10) }"
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  # The integration suite runs serially inside one process (each file resets its own database), so it is split into
  # independent shards, each with its own PostgreSQL service. The `rest` shard excludes the three heavy files that
  # have their own shard, so every file under tests/integration runs in exactly one shard.
  integration-shard:
    name: integration-shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: http-smoke
            args: tests/integration/http-smoke.test.ts
          - shard: container-image
            args: tests/integration/container-image.test.ts
          - shard: backup-restore
            args: tests/integration/backup-restore.test.ts
          - shard: rest
            args: --exclude **/http-smoke.test.ts --exclude **/container-image.test.ts --exclude **/backup-restore.test.ts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bmsl
          POSTGRES_PASSWORD: bmsl_ci
          POSTGRES_DB: bmsl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bmsl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bmsl:bmsl_ci@localhost:5432/bmsl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap pilot
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No application package yet; control-plane pilot only."
      - uses: pnpm/action-setup@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          version: 10.34.4
      - name: Install application dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile
      - name: Required application integration suite
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          node -e "const p=require('./package.json'); if (!p.scripts?.['test:integration']) { console.error('Missing required script test:integration'); process.exit(2) }"
          pnpm test:integration ${{ matrix.args }}

  # Stable required check name for branch protection: passes only when every shard passed.
  integration:
    name: integration
    needs: integration-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All integration shards must succeed
        env:
          RESULT: ${{ needs.integration-shard.result }}
        run: |
          echo "integration-shard result: $RESULT"
          test "$RESULT" = "success"
